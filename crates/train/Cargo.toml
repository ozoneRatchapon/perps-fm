[package]
name = "perpsfm-train"
version.workspace = true
edition.workspace = true

[dependencies]
perpsfm-core.workspace = true
perpsfm-features.workspace = true
perpsfm-model.workspace = true
perpsfm-eval.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
polars.workspace = true
candle-core.workspace = true
candle-nn.workspace = true

[features]
metal = ["perpsfm-model/metal", "candle-core/metal", "candle-nn/metal"]

# Apple Accelerate BLAS is macOS-only; CI (linux) builds candle without it.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["accelerate"] }
candle-nn = { workspace = true, features = ["accelerate"] }
